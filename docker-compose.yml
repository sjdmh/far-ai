# ── Far AI — یک Docker Compose تمام سیستم را بالا می‌آورد ──
# اجرا:  docker compose up -d --build
# (یک فایل .env در همین پوشه بسازید — نمونه: .env.example)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-far}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-far-secret}
      POSTGRES_DB: ${POSTGRES_DB:-far_ai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-far} -d ${POSTGRES_DB:-far_ai}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-far}:${POSTGRES_PASSWORD:-far-secret}@db:5432/${POSTGRES_DB:-far_ai}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env
    environment:
      FAR_API_URL: http://backend:8000
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-web:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  pgdata:
  certbot-web:
  certbot-certs:
